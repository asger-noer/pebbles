version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        nullable: false
        go_type: github.com/google/uuid.UUID

sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "queries"
        out: "queries"
        sql_package: "pgx/v5"
